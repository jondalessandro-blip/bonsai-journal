kind = "web"
previewPath = "/"
title = "Bonsai Journal"
version = "1.0.0"
id = "artifacts/bonsai-journal"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24394

[services.development]
run = "pnpm --filter @workspace/bonsai-journal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bonsai-journal", "run", "build" ]
serve = "static"
publicDir = "artifacts/bonsai-journal/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24394"
BASE_PATH = "/"
